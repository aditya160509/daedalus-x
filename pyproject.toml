[project]
name = "daedalus"
version = "0.1.0"
description = "Daedalus X — Veloira autonomous race engineering system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.13.0",
    "fastapi>=0.162.0",
    "foamlib>=1.10.0",
    "numpy>=2.5.4",
    "pint>=0.26.2",
    "pydantic>=2",
    "pyvista>=0.49.2",
    "scipy>=1.18.1",
    "trimesh>=5.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
daedalus = "daedalus.cli:main"
daedalus-api = "daedalus.api.__main__:main"

[tool.pyrefly.errors]
implicit-any = "error"
method-assign = "error"
implicit-any-parameter = "error"
no-any-return = "error"
redundant-cast = "warn"
unannotated-return = "error"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# physics symbols (U, L, W, H) follow engineering convention
"src/daedalus/cfd.py" = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running (CFD) tests"]

[tool.pyrefly]
python-version = "3.12.0"
preset = "strict"
ignore-missing-imports = [
    "scipy.*",
    "pint.*",
    "trimesh.*",
]
check-unannotated-defs = true
infer-return-types = "never"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
