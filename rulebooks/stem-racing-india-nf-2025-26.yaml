# STEM Racing India National Finals 2025-26 (Season 8) Technical Regulations: the team's event rulebook.
# Source PDF: "STEM Racing India_NF_2025-26_TechnicalRegulations.pdf" (58 pages).
# Local copy: data/reference/rules/india_nf_2025_26/technical_regulations.pdf (git-ignored).
# sha256: 95cb92fe474b9b78e90f4939555a2675c96a04ab92079e247a386efe49ff1231
# Competition Regulations sha256: 6fdd441b54a1a2fbf48f63019f21728d658386bd902a499d74c710ef279338bf
# Page numbers are the printed "N | Page" footers. Amendments are published by email and shown as red
# underlined text in the PDF, so re-check this file whenever the organisers send one (T2.3).
#
# class: general | safety | performance (T2.4). A performance failure makes the car ineligible for
# Fastest Car and Best Engineered Car, and a team failing one on both cars seeded in the top 16 is
# knocked out in round one (Competition Regs C3.6.2).
# Safety rules marked "rectify: true" get the 10-minute service fix at half the penalty (C4.5).
# "PP" in the penalty means proportional: charged per whole unit outside the limit, rounded up (T2.5.2).
#
# computable: false means FORGE cannot measure it from the CAD parts and axles yet; it shows as manual review
# and the "measure" name is the measure to build next (MASTER-PLAN section 1.3). Rules marked
# approx: true use a bounding-box estimate that can prove a failure only loosely and cannot prove a pass.
#
# Known inconsistencies in the source documents (not resolved here, ask competitions@stemplify.com):
#   * T1.20 calls the cartridge "compressed air"; C9.12 says "compressed gas".
#   * Competition Regs C3.5 gives Verbal Presentation as 60/40/40 (technique/composition/subject) but the
#     scorecard on page 45 totals 40/40/60.
#   * C9.1 says races use automatic launch; C9.4 and C9.7.2 describe manual driver-reaction launch.
#   * Technical Regs Appendix iii numbers the front wing rules T8.5.1-T8.5.3; the rules are T8.6.1-T8.6.3.
#   * T4.4.5 halo load reads "1kg load ... loading of 2kg (to be reviewed)".
revision: stem-racing-india-nf-2025-26
is_reference_only: false
